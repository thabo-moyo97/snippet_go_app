{{define "title"}}Signup{{end}}

{{define "main"}}
    <form action='/user/signup' method='POST' novalidate class="max-w-md mx-auto">
        <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
        <div class="mb-4">
            <label class="block mb-2">Name:</label>
            {{if .Form.FieldErrors.name}}
                <label class="text-[#C0392B] font-bold block mb-2">{{index .Form.FieldErrors.name 0}}</label>
            {{end}}
            <input type='text' name='name' value='{{.Form.Name}}'
                   class="w-full p-3 border border-[#E4E5E7] rounded text-[#6A6C6F]">
        </div>
        <div class="mb-4">
            <label class="block mb-2">Email:</label>
            {{if .Form.FieldErrors.email}}
                <label class="text-[#C0392B] font-bold block mb-2">{{index .Form.FieldErrors.email 0}}</label>
            {{end}}
            <input type='email' name='email' value='{{.Form.Email}}'
                   class="w-full p-3 border border-[#E4E5E7] rounded text-[#6A6C6F]">
        </div>
        <div class="mb-4">
            <label class="block mb-2">Password:</label>
            {{if .Form.FieldErrors.password}}
                <label class="text-[#C0392B] font-bold block mb-2">{{index .Form.FieldErrors.password 0}}</label>
            {{end}}
            <input type='password' name='password'
                   class="w-full p-3 border border-[#E4E5E7] rounded text-[#6A6C6F]">
        </div>
        <div class="mt-6">
            <input type='submit' value='Signup'
                   class="bg-[#62CB31] text-white px-7 py-4 rounded font-bold hover:bg-[#4EB722] cursor-pointer">
        </div>
    </form>
{{end}}
